
name: floci-smart-cloud
services:
  # AWS Floci Service
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      # floci also listens on 80/443 (emulated ALB listeners) and allocates
      # 7000+ for per-resource proxies such as the RDS endpoint. Without these
      # published, the ALB is reachable only from inside the floci_default
      # network -- curl from the host just times out.
      - "80:80"
      - "443:443"
      - "7000-7010:7000-7010"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default

  # GCP Floci Service (Smartass)
  floci-gcp:
    image: floci/floci-gcp:latest
    ports:
      - "4588:4588"
    volumes:
      - ./data-gcp:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_GCP_HOSTNAME: floci-gcp
      FLOCI_GCP_BASE_URL: http://floci-gcp:4588
      FLOCI_GCP_STORAGE_MODE: ${FLOCI_GCP_STORAGE_MODE:-memory}
    labels:
      - "floci-gcp=true"
    networks:
      - default

volumes:
  data-gcp:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_network