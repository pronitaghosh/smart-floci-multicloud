<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!--
    Sized for a WhatsApp status / IG story: 1080x1920.
    All content is kept between y=170 and y=1650 because the app overlays the
    profile row at the top (~150px) and the reply bar at the bottom (~250px).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- ================= header ================= -->
  <rect x="72" y="176" width="132" height="8" rx="4" fill="url(#accent)"/>

  <text x="72" y="266" font-size="64" font-weight="800" fill="#f8fafc">A full AWS</text>
  <text x="72" y="338" font-size="64" font-weight="800" fill="#f8fafc">platform.</text>
  <text x="72" y="410" font-size="64" font-weight="800" fill="#2dd4bf">On a laptop.</text>

  <text x="72" y="474" font-size="30" fill="#94a3b8">Terraform + Terragrunt, applied against a local</text>
  <text x="72" y="514" font-size="30" fill="#94a3b8">AWS emulator. No account. No cloud spend.</text>

  <!-- ================= stats ================= -->
  <rect x="72" y="566" width="284" height="140" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="214" y="638" font-size="58" font-weight="800" fill="#2dd4bf" text-anchor="middle">67</text>
  <text x="214" y="676" font-size="24" fill="#94a3b8" text-anchor="middle">AWS resources</text>

  <rect x="398" y="566" width="284" height="140" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="540" y="638" font-size="58" font-weight="800" fill="#38bdf8" text-anchor="middle">4</text>
  <text x="540" y="676" font-size="24" fill="#94a3b8" text-anchor="middle">layered stacks</text>

  <rect x="724" y="566" width="284" height="140" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="866" y="638" font-size="58" font-weight="800" fill="#a78bfa" text-anchor="middle">$0</text>
  <text x="866" y="676" font-size="24" fill="#94a3b8" text-anchor="middle">cloud cost</text>

  <!-- ================= flow ================= -->

  <rect x="72" y="756" width="936" height="118" rx="18" fill="#0f2b2b" stroke="#2dd4bf" stroke-width="2.5"/>
  <text x="112" y="808" font-size="33" font-weight="700" fill="#5eead4">Terragrunt</text>
  <text x="112" y="846" font-size="24" fill="#7dd3c0">bootstrap → iam → stateful → standard</text>
  <text x="968" y="828" font-size="24" fill="#5eead4" text-anchor="end">one YAML config</text>

  <path d="M540,882 L540,916" stroke="#475569" stroke-width="3" marker-end="url(#ar)" fill="none"/>

  <rect x="72" y="928" width="936" height="140" rx="18" fill="#132038" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="112" y="982" font-size="33" font-weight="700" fill="#7dd3fc">floci</text>
  <text x="112" y="1020" font-size="24" fill="#93c5fd">the emulated AWS control plane · one container</text>
  <text x="112" y="1051" font-size="21" fill="#64748b">VPC · IAM · KMS · S3 · SSM · ECR · ACM · Secrets Manager · ELB</text>

  <path d="M540,1076 L540,1110" stroke="#475569" stroke-width="3" marker-end="url(#ar)" fill="none"/>
  <text x="562" y="1101" font-size="21" fill="#64748b">starts real containers for</text>

  <rect x="72" y="1122" width="296" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="220" y="1170" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">EKS</text>
  <text x="220" y="1204" font-size="22" fill="#94a3b8" text-anchor="middle">real k3s</text>

  <rect x="392" y="1122" width="296" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="540" y="1170" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">RDS</text>
  <text x="540" y="1204" font-size="22" fill="#94a3b8" text-anchor="middle">real Postgres</text>

  <rect x="712" y="1122" width="296" height="110" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="860" y="1170" font-size="28" font-weight="700" fill="#e2e8f0" text-anchor="middle">ECR</text>
  <text x="860" y="1204" font-size="22" fill="#94a3b8" text-anchor="middle">real registry</text>

  <path d="M220,1240 L220,1274" stroke="#475569" stroke-width="3" marker-end="url(#ar)" fill="none"/>

  <!-- running on the cluster -->
  <rect x="72" y="1286" width="936" height="246" rx="18" fill="#1a1533" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="112" y="1336" font-size="27" font-weight="700" fill="#c4b5fd">Running on the cluster</text>

  <rect x="112" y="1358" width="424" height="76" rx="12" fill="#241d47" stroke="#7c3aed" stroke-width="2"/>
  <text x="324" y="1389" font-size="26" font-weight="700" fill="#ddd6fe" text-anchor="middle">Vault · 3× Raft</text>
  <text x="324" y="1418" font-size="20" fill="#a5b4fc" text-anchor="middle">auto-unsealed by emulated KMS</text>

  <rect x="556" y="1358" width="420" height="76" rx="12" fill="#241d47" stroke="#7c3aed" stroke-width="2"/>
  <text x="766" y="1389" font-size="26" font-weight="700" fill="#ddd6fe" text-anchor="middle">ArgoCD</text>
  <text x="766" y="1418" font-size="20" fill="#a5b4fc" text-anchor="middle">GitOps from the repo</text>

  <rect x="112" y="1448" width="864" height="70" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="544" y="1478" font-size="24" font-weight="600" fill="#e2e8f0" text-anchor="middle">gateway · user-service · order-service · payment-service</text>
  <text x="544" y="1506" font-size="20" fill="#94a3b8" text-anchor="middle">4 Node microservices, real traffic through the emulated ALB</text>

  <!-- ================= proof ================= -->
  <rect x="72" y="1556" width="936" height="98" rx="16" fill="#0c2a22" stroke="#10b981" stroke-width="2"/>
  <text x="112" y="1598" font-size="23" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">POST /api/orders</text>
  <text x="112" y="1634" font-size="23" fill="#a7f3d0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">→ 201  {"status":"paid"}</text>

  <!-- ================= footer ================= -->
  <text x="540" y="1712" font-size="27" font-weight="600" fill="#94a3b8" text-anchor="middle">~20 min on AWS  →  seconds locally</text>
  <text x="540" y="1756" font-size="23" fill="#64748b" text-anchor="middle">github.com/elokac/floci-aws-demo</text>
</svg>
