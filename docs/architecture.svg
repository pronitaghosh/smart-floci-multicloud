<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 796" width="1180" height="796" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arwOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arwBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="1180" height="796" fill="#ffffff"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">A production-shaped AWS platform, running locally on floci</text>
  <text x="40" y="72" font-size="15" fill="#64748b">Terragrunt → 4 layered stacks → emulated AWS → real containers. Vault, ArgoCD and 4 microservices on one laptop.</text>

  <!-- ===== host ===== -->
  <rect x="40" y="96" width="1100" height="594" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="122" font-size="13" font-weight="700" fill="#475569" letter-spacing="1.2">YOUR MACBOOK</text>

  <rect x="66" y="142" width="176" height="112" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="154" y="164" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Terragrunt</text>
  <text x="154" y="182" font-size="10.5" fill="#64748b" text-anchor="middle">one YAML config</text>
  <text x="154" y="202" font-size="11" fill="#0f766e" text-anchor="middle">bootstrap → iam</text>
  <text x="154" y="218" font-size="11" fill="#0f766e" text-anchor="middle">→ stateful → standard</text>
  <text x="154" y="238" font-size="10.5" fill="#64748b" text-anchor="middle">20 modules · 4 states</text>

  <rect x="66" y="272" width="176" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="154" y="296" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">kubectl · docker</text>
  <text x="154" y="315" font-size="11.5" fill="#64748b" text-anchor="middle">build · push · deploy</text>

  <rect x="66" y="350" width="176" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="154" y="374" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="middle">curl</text>
  <text x="154" y="393" font-size="11.5" fill="#64748b" text-anchor="middle">:80 → ALB</text>

  <!-- ===== docker network ===== -->
  <rect x="286" y="146" width="828" height="520" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="306" y="170" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1">DOCKER NETWORK — floci_default — 172.18.0.0/16</text>

  <!-- floci -->
  <rect x="308" y="188" width="238" height="222" rx="9" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.5"/>
  <text x="427" y="213" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">floci · 172.18.0.2</text>
  <text x="427" y="232" font-size="11.5" fill="#047857" text-anchor="middle">the emulated AWS control plane</text>

  <rect x="326" y="248" width="202" height="30" rx="5" fill="#ffffff" stroke="#5eead4"/>
  <text x="427" y="268" font-size="12" fill="#0f172a" text-anchor="middle">:4566  API — all services</text>
  <rect x="326" y="286" width="202" height="34" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="427" y="307" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">:80 / :443  ALB listeners</text>
  <rect x="326" y="328" width="202" height="30" rx="5" fill="#ffffff" stroke="#5eead4"/>
  <text x="427" y="348" font-size="12" fill="#0f172a" text-anchor="middle">:7001  RDS proxy</text>

  <text x="427" y="376" font-size="11" fill="#047857" text-anchor="middle">IAM · KMS · S3 · SSM · ECR · ACM</text>
  <text x="427" y="394" font-size="11" fill="#047857" text-anchor="middle">Secrets Manager · VPC · ELBv2</text>

  <!-- ===== k3s ===== -->
  <text x="1092" y="176" font-size="11.5" font-weight="700" fill="#475569" letter-spacing="0.8" text-anchor="end">REAL CONTAINERS floci STARTS FOR YOU</text>
  <rect x="600" y="188" width="492" height="356" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="620" y="214" font-size="14" font-weight="700" fill="#1e3a8a">EKS → k3s container · 172.18.0.5</text>
  <text x="620" y="233" font-size="11.5" fill="#1d4ed8">rancher/k3s — a genuine Kubernetes API</text>

  <rect x="620" y="286" width="152" height="34" rx="5" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="696" y="308" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">NodePort :30080</text>

  <!-- pod network -->
  <rect x="620" y="326" width="452" height="130" rx="7" fill="#ffffff" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="638" y="346" font-size="11.5" font-weight="700" fill="#b91c1c">POD NETWORK 10.42.0.0/16</text>
  <text x="638" y="363" font-size="10.5" fill="#b91c1c">floci's ALB has no route here — registering pod IPs gives Target.Timeout</text>

  <rect x="638" y="372" width="94" height="76" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="685" y="396" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">gateway</text>
  <text x="685" y="414" font-size="11" fill="#64748b" text-anchor="middle">:4000</text>
  <text x="685" y="432" font-size="11" fill="#64748b" text-anchor="middle">×2</text>

  <rect x="744" y="372" width="94" height="76" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="791" y="396" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">user-svc</text>
  <text x="791" y="414" font-size="11" fill="#64748b" text-anchor="middle">:4001</text>
  <text x="791" y="432" font-size="11" fill="#64748b" text-anchor="middle">×2</text>

  <rect x="850" y="372" width="94" height="76" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="897" y="396" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">order-svc</text>
  <text x="897" y="414" font-size="11" fill="#64748b" text-anchor="middle">:4002</text>
  <text x="897" y="432" font-size="11" fill="#64748b" text-anchor="middle">×2</text>

  <rect x="956" y="372" width="94" height="76" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1003" y="396" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">payment</text>
  <text x="1003" y="414" font-size="11" fill="#64748b" text-anchor="middle">:4003</text>
  <text x="1003" y="432" font-size="11" fill="#64748b" text-anchor="middle">×2</text>


  <!-- platform tooling -->
  <rect x="620" y="466" width="222" height="62" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="731" y="486" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">Vault · 3× Raft</text>
  <text x="731" y="503" font-size="10" fill="#6d28d9" text-anchor="middle">auto-unsealed by floci KMS</text>
  <text x="731" y="519" font-size="10" fill="#6d28d9" text-anchor="middle">root token → Secrets Manager</text>

  <rect x="852" y="466" width="220" height="62" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="962" y="486" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">ArgoCD</text>
  <text x="962" y="503" font-size="10" fill="#6d28d9" text-anchor="middle">reconciles k8s/ from git</text>
  <text x="962" y="519" font-size="10" fill="#6d28d9" text-anchor="middle">owns the 4 Deployments</text>

  <!-- ===== postgres / registry ===== -->
  <rect x="600" y="566" width="238" height="76" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="719" y="591" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">RDS → postgres:16</text>
  <text x="719" y="610" font-size="11.5" fill="#1d4ed8" text-anchor="middle">172.18.0.6 · a real database</text>
  <text x="719" y="628" font-size="11.5" fill="#1d4ed8" text-anchor="middle">reached via floci :7001</text>

  <rect x="854" y="566" width="238" height="76" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="973" y="591" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">ECR → registry:2</text>
  <text x="973" y="610" font-size="11.5" fill="#1d4ed8" text-anchor="middle">172.18.0.3 · :5100</text>
  <text x="973" y="628" font-size="11.5" fill="#1d4ed8" text-anchor="middle">a real OCI registry</text>

  <!-- ===== arrows ===== -->
  <!-- terraform -> api -->
  <path d="M242,198 C270,198 278,258 302,264" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)" fill="none"/>
  <text x="268" y="182" font-size="10.5" fill="#475569" text-anchor="middle">apply</text>
  <!-- kubectl -> api -->
  <path d="M242,302 C270,302 280,282 302,276" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)" fill="none"/>
  <!-- curl -> alb listener -->
  <path d="M242,380 C272,380 282,312 302,305" stroke="#0f766e" stroke-width="2" marker-end="url(#arwOk)" fill="none"/>

  <!-- ALB -> NodePort : the fix -->
  <path d="M546,303 L612,303" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arwOk)" fill="none"/>
  <text x="620" y="268" font-size="11.5" font-weight="700" fill="#0f766e">✓ the ALB reaches the node, never the pods</text>

  <!-- NodePort -> gateway pods -->
  <path d="M685,320 L685,368" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arwOk)" fill="none"/>

  <!-- floci starts k3s -->
  <path d="M546,214 L594,214" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arwBlue)" fill="none" stroke-dasharray="4 3"/>
  <text x="570" y="206" font-size="10" fill="#1d4ed8" text-anchor="middle">starts</text>

  <!-- floci starts postgres / registry -->
  <path d="M427,410 L427,604 L594,604" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arwBlue)" fill="none" stroke-dasharray="4 3"/>
  <text x="470" y="598" font-size="10" fill="#1d4ed8" text-anchor="middle">starts</text>

  <!-- pods -> postgres -->
  <path d="M745,528 C745,548 740,556 736,562" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)" fill="none"/>
  <text x="800" y="552" font-size="10" fill="#475569" text-anchor="middle">SQL via :7001</text>

  <!-- registry -> k3s (image pull) -->
  <path d="M973,566 L973,546" stroke="#475569" stroke-width="1.8" marker-end="url(#arw)" fill="none" stroke-dasharray="4 3"/>
  <text x="1043" y="558" font-size="10" fill="#475569" text-anchor="middle">image pull</text>

  <!-- ===== legend ===== -->
  <rect x="40" y="706" width="1100" height="64" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="62" y1="730" x2="96" y2="730" stroke="#0f766e" stroke-width="2.6"/>
  <text x="106" y="734" font-size="12" fill="#334155">works</text>

  <line x1="176" y1="730" x2="210" y2="730" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="220" y="734" font-size="12" fill="#334155">emulation gap</text>

  <line x1="332" y1="730" x2="366" y2="730" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="376" y="734" font-size="12" fill="#334155">floci starts a real container</text>

  <rect x="600" y="725" width="30" height="11" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="640" y="734" font-size="12" fill="#334155">platform tooling (Helm)</text>

  <text x="62" y="756" font-size="11.5" fill="#64748b">CloudFront is disabled locally: the AWS provider segfaults reading floci’s response. ElastiCache applies, but returns the endpoint “localhost” — unreachable from a pod — so caching is off.</text>
</svg>
