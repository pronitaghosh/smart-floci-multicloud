apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: msdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/msdemo/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: msdemo-config
            - secretRef:
                name: msdemo-db-secret
          env:
            - name: PORT
              value: "4001"
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: msdemo
spec:
  selector:
    app: user-service
  ports:
    - port: 4001
      targetPort: 4001
