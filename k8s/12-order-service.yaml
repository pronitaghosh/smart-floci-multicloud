apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: msdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/msdemo/order-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: msdemo-config
            - secretRef:
                name: msdemo-db-secret
          env:
            - name: PORT
              value: "4002"
          readinessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: msdemo
spec:
  selector:
    app: order-service
  ports:
    - port: 4002
      targetPort: 4002
