apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: msdemo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: 000000000000.dkr.ecr.us-east-1.localhost:5100/msdemo/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
          readinessProbe:
            httpGet: { path: /healthz, port: 4003 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4003 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: msdemo
spec:
  selector:
    app: payment-service
  ports:
    - port: 4003
      targetPort: 4003
