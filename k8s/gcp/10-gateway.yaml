apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: smartcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          # Local image imported into k3s (no Artifact Registry on emulator).
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: smartcloud-config
          env:
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: smartcloud
spec:
  # NodePort, not ClusterIP: local access reaches the gateway through the
  # node address, same pattern as the AWS overlay. A load balancer would
  # register pod IPs directly; that Terraform stays in Block 8.
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30080
