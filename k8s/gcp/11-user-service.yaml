apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: smartcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          # Local image imported into k3s (no Artifact Registry on emulator).
          image: user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          envFrom:
            - configMapRef:
                name: smartcloud-config
            - secretRef:
                name: smartcloud-db-secret
          env:
            - name: PORT
              value: "4001"
          readinessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4001 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: smartcloud
spec:
  selector:
    app: user-service
  ports:
    - port: 4001
      targetPort: 4001
