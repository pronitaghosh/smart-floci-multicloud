apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: smartcloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          # Local image imported into k3s (no Artifact Registry on emulator).
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          envFrom:
            - configMapRef:
                name: smartcloud-config
            - secretRef:
                name: smartcloud-db-secret
          env:
            - name: PORT
              value: "4002"
          readinessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 4002 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: smartcloud
spec:
  selector:
    app: order-service
  ports:
    - port: 4002
      targetPort: 4002
